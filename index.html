<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个GitHub项目</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .version {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 我的第一个GitHub项目</h1>
        <div class="version">版本：v1.0.0</div>
        
        <div class="feature">
            <h3>📝 项目介绍</h3>
            <p>这是我学习GitHub版本控制的第一个项目。</p>
        </div>
        
        <div class="feature">
            <h3>✨ 功能特性</h3>
            <ul>
                <li>美观的响应式设计</li>
                <li>现代化CSS样式</li>
                <li>版本控制学习演示</li>
            </ul>
        </div>
        
        <div class="feature">
            <h3>🎯 学习目标</h3>
            <ul>
                <li>掌握GitHub基本操作</li>
                <li>理解版本控制概念</li>
                <li>学会文件管理和提交</li>
            </ul>
        </div>
    </div>
</body>
</html>
